name: Prueba de conexión (no instala nada)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/conexion.yml']
  workflow_dispatch:

jobs:
  conexion:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: 1 · Secretos presentes
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF TG; do
            if [ -z "${!v}" ]; then echo "FALTA $v"; exit 1; else echo "OK $v"; fi
          done
          REF=$(echo "$PROJECT_REF" | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
          [ "$REF" = "mgvlvqhnnfhaytjkrtqj" ] && echo "OK ref coincide con simub" || { echo "REF NO COINCIDE (empieza con ${REF:0:4})"; exit 1; }
      - name: 2 · Telegram
        run: |
          curl -sS "https://api.telegram.org/bot$TG/getMe" | python3 -c "import sys,json;d=json.load(sys.stdin);print('OK bot @'+d['result']['username'] if d.get('ok') else 'ERROR Telegram: '+str(d.get('description')));sys.exit(0 if d.get('ok') else 1)"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: 3 · Llave de Supabase
        run: supabase projects list | grep -q mgvlvqhnnfhaytjkrtqj && echo "OK la llave ve el proyecto simub" || { echo "ERROR la llave no ve simub"; supabase projects list | cut -c1-120; exit 1; }
      - name: 4 · Contraseña de la base de datos
        run: |
          set -o pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | sed "s/$SUPABASE_DB_PASSWORD/***/g" | tail -5
          mkdir -p supabase/migrations
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 | sed "s/$SUPABASE_DB_PASSWORD/***/g" | tail -8
          echo "OK conexión a la base de datos"
