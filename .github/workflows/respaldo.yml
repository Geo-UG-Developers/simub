name: Respaldo diario de la base (cifrado)
# Cada día exporta la base de datos (estructura y datos) y la cifra con la contraseña de la base (secreto SUPABASE_DB_PASSWORD).
#   · Diario: 30 días en Actions › este flujo › Artifacts.
#   · Semanal (domingo): 90 días en Artifacts.
#   · Mensual (día 1): sin vencimiento, en un «release» en borrador que solo ven quienes administran el repositorio.
# Aunque el repositorio es público, el archivo cifrado no se puede abrir sin esa contraseña.
# Cómo restaurar: ver RESPALDOS.md
on:
  schedule:
    - cron: '41 9 * * *'   # diario 3:41 a. m. hora de Guanajuato
  workflow_dispatch:

permissions:
  contents: write

jobs:
  respaldo:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Exportar y cifrar
        run: |
          set -o pipefail
          REF=$(echo "$PROJECT_REF" | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')
          supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD" > /dev/null 2>&1
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f esquema.sql 2>&1 | sed "s/$SUPABASE_DB_PASSWORD/***/g" | tail -3
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only -f datos.sql 2>&1 | sed "s/$SUPABASE_DB_PASSWORD/***/g" | tail -3
          test -s esquema.sql && test -s datos.sql
          echo "Tamaño: $(du -h datos.sql | cut -f1) de datos"
          tar czf respaldo.tgz esquema.sql datos.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SUPABASE_DB_PASSWORD" --symmetric --cipher-algo AES256 \
            -o "respaldo_$(date -u +%F).tgz.gpg" respaldo.tgz
          rm -f esquema.sql datos.sql respaldo.tgz
      - name: Tipo de copia
        id: tipo
        run: |
          if [ "$(date -u +%d)" = "01" ]; then echo "t=mensual" >> "$GITHUB_OUTPUT"; elif [ "$(date -u +%u)" = "7" ]; then echo "t=semanal" >> "$GITHUB_OUTPUT"; else echo "t=diaria" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ steps.tipo.outputs.t }}-${{ github.run_number }}
          path: respaldo_*.tgz.gpg
          retention-days: ${{ steps.tipo.outputs.t == 'diaria' && 30 || 90 }}
      - name: Copia mensual permanente (borrador privado)
        if: steps.tipo.outputs.t == 'mensual' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view respaldos-mensuales > /dev/null 2>&1 || \
            gh release create respaldos-mensuales --draft --title "Respaldos mensuales (cifrados)" --notes "Copias cifradas de la base. Ver RESPALDOS.md."
          gh release upload respaldos-mensuales respaldo_*.tgz.gpg --clobber
